{% extends "base.html" %}

{% block content %}
  <div class="delete-confirmation">
    <h1>Are you sure you want to delete this auction item?</h1>
    <p><strong>{{ auction_item.name }}</strong> - Starting Price: ${{ auction_item.starting_price }}</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Confirm Delete</button>
      <a href="{% url 'auct_detail' pk=auction.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
{% endblock %}

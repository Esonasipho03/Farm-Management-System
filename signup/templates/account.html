{% extends 'base.html' %}

{% block title %} User Account - GreenFarm{% endblock %}

{% block content %}
<div class="account-container">
    <h2>Your Account</h2>
    <form method="post" action="{% url 'account' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Update</button>
    </form>
</div>
{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Landing Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            color: #fff;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: url("{% static 'images/backk.jpg' %}"); /* Your image path */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Transparent dark overlay */
            z-index: 1;
        }
        .header {
            z-index: 2; /* Position the text above the overlay */
            position: relative;
        }
        .header h1 {
            font-size: 4rem;
            background: linear-gradient(to right, #66ff99, #ff99cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtext {
            margin-top: 20px;
            font-size: 1.5rem;
            color: #ccc;
        }
        .cta-button {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #00ff99;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s ease;
        }
        .cta-button:hover {
            background-color: #33cc66;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="header">
        <h1>The Future of Smart Farming</h1>
        <p class="subtext">Efficient farm management made easy with our all-in-one platform.</p>
        <button class="cta-button" onclick="window.location.href='{% url 'signup' %}'">Sign Up</button>
    </div>
</body>
</html>

<!-- customer_login.html -->
<div class="login-container">
    <div class="login-box">
        <h2>GreenFarm Login</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" value="{{ form.username.value|default_if_none:'' }}">
                {{ form.username.errors }}
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <div class="password-container">
                    <input type="password" id="password" name="password">
                    <span id="togglePassword" onclick="togglePasswordVisibility()">
                        🔒
                    </span>
                </div>
                {{ form.password.errors }}
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>
        <p><a href="{% url 'password_reset_request' %}">Forgot your password?</a></p>
        <p>Don't have an account? <a href="{% url 'signup' %}">Register here</a></p>
    </div>
</div>

<style>
    /* General container styling */
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f4f4f4;
        font-family: 'Arial', sans-serif;
    }

    /* Login box styling */
    .login-box {
        background-color: #fff;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        text-align: center;
    }

    .login-box h2 {
        margin-bottom: 20px;
        font-size: 24px;
        color: #333;
    }

    .login-box form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .login-box input[type="text"],
    .login-box input[type="password"] {
        padding: 12px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #f9f9f9;
        width: calc(100% - 30px); /* Adjusted for icon */
        display: inline-block;
    }

    .login-box input[type="text"]:focus,
    .login-box input[type="password"]:focus {
        border-color: #28a745;
        outline: none;
    }

    /* Password container styling */
    .password-container {
        position: relative;
    }

    #togglePassword {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 20px;
    }

    /* Login button styling */
    .login-btn {
        background-color: #28a745;
        color: white;
        padding: 12px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .login-btn:hover {
        background-color: #218838;
    }

    /* Links styling */
    .login-box p {
        margin-top: 10px;
        color: #333;
    }

    .login-box a {
        color: #28a745;
        text-decoration: none;
    }

    .login-box a:hover {
        text-decoration: underline;
    }
</style>

<script>
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            togglePassword.textContent = '🙈'; // Change icon to open
        } else {
            passwordInput.type = 'password';
            togglePassword.textContent = '🔒'; // Change icon to closed
        }
    }
</script>
